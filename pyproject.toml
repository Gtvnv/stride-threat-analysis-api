[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stride-threat-analysis-api"
version = "0.1.0"
description = "API que analisa diagramas de arquitetura e gera ameaças classificadas pelo STRIDE."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "openai",
    "python-multipart",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "hypothesis",
    "pytest-socket",
    "pillow",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "allow_azure_client_init: permite construir AzureOpenAIClient (com sdk_factory fake) sem o bloqueio do conftest",
]
